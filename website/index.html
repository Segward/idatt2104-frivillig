<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>crdt demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  section { border: 1px solid #ddd; border-radius: 0.5rem; padding: 1.25rem; margin-bottom: 1.5rem; }
  section h2 { margin: 0 0 0.75rem; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: #666; }
  #counter-val { font-size: 4rem; margin: 0; text-align: center; }
  #counter-buttons { text-align: center; margin-top: 0.5rem; }
  button { font-size: 1rem; padding: 0.4rem 1rem; }
  #list-add { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  #list-add input { flex: 1; padding: 0.4rem 0.6rem; font-size: 1rem; }
  ul#list-items { list-style: none; padding: 0; margin: 0; }
  ul#list-items li { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; }
  ul#list-items li button { font-size: 0.85rem; padding: 0.2rem 0.5rem; }
  #text-area { width: 100%; min-height: 8rem; font-family: ui-monospace, monospace; font-size: 0.95rem; padding: 0.5rem; box-sizing: border-box; }
  #status { color: #666; font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
  <section>
    <h2>PN counter</h2>
    <h1 id="counter-val">0</h1>
    <div id="counter-buttons">
      <button id="dec">−</button>
      <button id="inc">+</button>
    </div>
  </section>

  <section>
    <h2>RGA list</h2>
    <div id="list-add">
      <input id="list-input" type="text" placeholder="new item" />
      <button id="list-add-btn">add</button>
    </div>
    <ul id="list-items"></ul>
  </section>

  <section>
    <h2>RGA text</h2>
    <textarea id="text-area" placeholder="collaborative text…"></textarea>
  </section>

  <div id="status">connecting…</div>

<script>
const WS_URL = (location.protocol === "file:")
  ? "ws://127.0.0.1:12345"
  : `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;

const counterValEl = document.getElementById("counter-val");
const incBtn = document.getElementById("inc");
const decBtn = document.getElementById("dec");
const listItemsEl = document.getElementById("list-items");
const listInput = document.getElementById("list-input");
const listAddBtn = document.getElementById("list-add-btn");
const textArea = document.getElementById("text-area");
const statusEl = document.getElementById("status");

let clientId = null;
let ws = null;

// PN-counter state.
let counterLocal = { increments: {}, decrements: {} };

// RGA list state — mirrors the C++ list_RGA enough to apply ops locally.
const listState = {
  nodes: new Map(),            // id -> { id, previous_id, value, deleted }
  children: new Map([["", []]]), // previous_id -> sorted [child id]
  applied: new Set(),
  sequence: 0,
};

function counterRecompute() {
  let total = 0;
  for (const v of Object.values(counterLocal.increments)) total += v;
  for (const v of Object.values(counterLocal.decrements)) total -= v;
  counterValEl.textContent = total;
}

function counterMergeRemote(remote) {
  const apply = (target, incoming) => {
    for (const [k, v] of Object.entries(incoming || {})) {
      target[k] = Math.max(target[k] || 0, v);
    }
  };
  apply(counterLocal.increments, remote.increments);
  apply(counterLocal.decrements, remote.decrements);
}

function counterSend() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: "counter",
    increments: counterLocal.increments,
    decrements: counterLocal.decrements,
  }));
}

function counterBumpInc() {
  if (!clientId) return;
  counterLocal.increments[clientId] = (counterLocal.increments[clientId] || 0) + 1;
  counterRecompute();
  counterSend();
}

function counterBumpDec() {
  if (!clientId) return;
  counterLocal.decrements[clientId] = (counterLocal.decrements[clientId] || 0) + 1;
  counterRecompute();
  counterSend();
}

incBtn.addEventListener("click", counterBumpInc);
decBtn.addEventListener("click", counterBumpDec);

// --- RGA list ---

function listNextId() {
  listState.sequence += 1;
  return `${clientId}:${String(listState.sequence).padStart(20, "0")}`;
}

function listApply(op) {
  if (!op.operation_id || listState.applied.has(op.operation_id)) return false;
  if (op.op_type === "insert") {
    if (!op.element_id || !op.value) return false;
    if (op.previous_id && !listState.nodes.has(op.previous_id)) return false;
    if (!listState.nodes.has(op.element_id)) {
      listState.nodes.set(op.element_id, {
        id: op.element_id,
        previous_id: op.previous_id,
        value: op.value,
        deleted: false,
      });
      const siblings = listState.children.get(op.previous_id) || [];
      if (!siblings.includes(op.element_id)) siblings.push(op.element_id);
      siblings.sort();
      listState.children.set(op.previous_id, siblings);
      if (!listState.children.has(op.element_id)) listState.children.set(op.element_id, []);
    }
  } else if (op.op_type === "delete") {
    if (!op.element_id) return false;
    const node = listState.nodes.get(op.element_id);
    if (!node) return false;
    node.deleted = true;
  } else {
    return false;
  }
  listState.applied.add(op.operation_id);
  return true;
}

function listRenderFlat() {
  const out = [];
  const walk = (parent) => {
    const kids = listState.children.get(parent) || [];
    for (const childId of kids) {
      const n = listState.nodes.get(childId);
      if (!n.deleted) out.push(n);
      walk(childId);
    }
  };
  walk("");
  return out;
}

function listRender() {
  const items = listRenderFlat();
  listItemsEl.innerHTML = "";
  for (const item of items) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = item.value;
    const btn = document.createElement("button");
    btn.textContent = "×";
    btn.addEventListener("click", () => listDelete(item.id));
    li.append(span, btn);
    listItemsEl.append(li);
  }
}

function listLastVisibleId() {
  const items = listRenderFlat();
  return items.length ? items[items.length - 1].id : "";
}

function listSendOp(op) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "list_op", ...op }));
}

function listAddAtEnd(value) {
  if (!clientId || !value) return;
  const id = listNextId();
  const op = {
    op_type: "insert",
    operation_id: id,
    element_id: id,
    previous_id: listLastVisibleId(),
    value,
  };
  listApply(op);
  listRender();
  listSendOp(op);
}

function listDelete(elementId) {
  if (!clientId) return;
  const op = {
    op_type: "delete",
    operation_id: listNextId(),
    element_id: elementId,
    previous_id: "",
    value: "",
  };
  listApply(op);
  listRender();
  listSendOp(op);
}

listAddBtn.addEventListener("click", () => {
  const v = listInput.value.trim();
  if (!v) return;
  listAddAtEnd(v);
  listInput.value = "";
  listInput.focus();
});
listInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") listAddBtn.click();
});

// --- RGA text ---

const textState = {
  nodes: new Map(),
  children: new Map([["", []]]),
  applied: new Set(),
  sequence: 0,
};
let textLocalSnapshot = "";       // last value we know the textarea reflects
let textSuppressInput = false;

function textNextId() {
  textState.sequence += 1;
  return `${clientId}:t:${String(textState.sequence).padStart(20, "0")}`;
}

function textApply(op) {
  if (!op.operation_id || textState.applied.has(op.operation_id)) return false;
  if (op.op_type === "insert") {
    if (!op.element_id || !op.value) return false;
    if (op.previous_id && !textState.nodes.has(op.previous_id)) return false;
    if (!textState.nodes.has(op.element_id)) {
      textState.nodes.set(op.element_id, {
        id: op.element_id,
        previous_id: op.previous_id,
        value: op.value[0],
        deleted: false,
      });
      const siblings = textState.children.get(op.previous_id) || [];
      if (!siblings.includes(op.element_id)) siblings.push(op.element_id);
      siblings.sort();
      textState.children.set(op.previous_id, siblings);
      if (!textState.children.has(op.element_id)) textState.children.set(op.element_id, []);
    }
  } else if (op.op_type === "delete") {
    if (!op.element_id) return false;
    const node = textState.nodes.get(op.element_id);
    if (!node) return false;
    node.deleted = true;
  } else {
    return false;
  }
  textState.applied.add(op.operation_id);
  return true;
}

// Walk and return parallel arrays of visible characters and their ids.
function textRenderFlat() {
  const chars = [];
  const ids = [];
  const walk = (parent) => {
    const kids = textState.children.get(parent) || [];
    for (const childId of kids) {
      const n = textState.nodes.get(childId);
      if (!n.deleted) { chars.push(n.value); ids.push(childId); }
      walk(childId);
    }
  };
  walk("");
  return { value: chars.join(""), ids };
}

function textSendOp(op) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "text_op", ...op }));
}

// Diff old vs new; produce delete ops for removed chars and insert ops for added chars.
function textDiffAndSend(oldStr, newStr, oldIds) {
  let p = 0;
  while (p < oldStr.length && p < newStr.length && oldStr[p] === newStr[p]) p++;
  let so = oldStr.length;
  let sn = newStr.length;
  while (so > p && sn > p && oldStr[so - 1] === newStr[sn - 1]) { so--; sn--; }

  // Deletes: remove ids at positions [p, so).
  for (let i = p; i < so; i++) {
    const op = {
      op_type: "delete",
      operation_id: textNextId(),
      element_id: oldIds[i],
      previous_id: "",
      value: " ",
    };
    textApply(op);
    textSendOp(op);
  }

  // Inserts: chain inserts starting after position (p - 1)'s id, or "" if at start.
  let previousId = p > 0 ? oldIds[p - 1] : "";
  for (let i = p; i < sn; i++) {
    const id = textNextId();
    const op = {
      op_type: "insert",
      operation_id: id,
      element_id: id,
      previous_id: previousId,
      value: newStr[i],
    };
    textApply(op);
    textSendOp(op);
    previousId = id;
  }
}

function textRender() {
  const { value } = textRenderFlat();
  if (textArea.value === value) { textLocalSnapshot = value; return; }
  const start = textArea.selectionStart;
  const end = textArea.selectionEnd;
  textSuppressInput = true;
  textArea.value = value;
  textSuppressInput = false;
  // Best-effort cursor preservation: clamp to new length.
  const cap = value.length;
  textArea.setSelectionRange(Math.min(start, cap), Math.min(end, cap));
  textLocalSnapshot = value;
}

textArea.addEventListener("input", () => {
  if (textSuppressInput || !clientId) return;
  const newStr = textArea.value;
  const { value: rendered, ids } = textRenderFlat();
  textDiffAndSend(rendered, newStr, ids);
  textLocalSnapshot = newStr;
});

// --- transport ---

function connect() {
  ws = new WebSocket(WS_URL);

  ws.addEventListener("open", () => {
    statusEl.textContent = "connected, waiting for auth…";
  });

  ws.addEventListener("message", (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch { return; }
    if (!msg || typeof msg !== "object") return;

    if (msg.type === "auth") {
      clientId = msg.id;
      counterLocal = { increments: {}, decrements: {} };
      statusEl.textContent = `connected as ${clientId}`;
      return;
    }
    if (msg.type === "counter") {
      counterMergeRemote(msg);
      counterRecompute();
      return;
    }
    if (msg.type === "list_init") {
      for (const op of msg.ops || []) listApply(op);
      listRender();
      return;
    }
    if (msg.type === "list_op") {
      if (listApply(msg)) listRender();
      return;
    }
    if (msg.type === "text_init") {
      for (const op of msg.ops || []) textApply(op);
      textRender();
      return;
    }
    if (msg.type === "text_op") {
      if (textApply(msg)) textRender();
      return;
    }
  });

  ws.addEventListener("close", () => {
    statusEl.textContent = "disconnected";
  });

  ws.addEventListener("error", () => {
    statusEl.textContent = "connection error";
  });
}

connect();
</script>
</body>
</html>
